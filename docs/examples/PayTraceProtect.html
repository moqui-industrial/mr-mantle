<!--
A reusable example of paying a Mantle payment with PayTrace Protect.js hosted fields. The card is typed into PayTrace's
own fields (an iframe); this page gets back only a single-use hpf_token and enc_key and posts them to Mantle's scoped
endpoint. The payment (created by the order or invoice flow) decides the organization, gateway, amount and currency; the
page sends only the token, the payer's choice to keep the card and an operation id. The answer is the gateway's state,
which the page shows but does not decide. The client key from Mantle is valid for 20 minutes: reload the page after
that. See ../PayTrace.md. An app serves its own copy of this page for a signed-in payer (the session cookie, and its
session token in X-CSRF-Token for the POST), with ?paymentId= set by the app.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Card payment</title>
        <style>
            body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 28rem; padding: 1rem; }
            button { font: inherit; padding: 0.6rem 1rem; }
            #pt_hpf_form { min-height: 12rem; }
            [hidden] { display: none; }
        </style>
    </head>
    <body>
        <h1>Card payment</h1>
        <p id="amount">Loading the payment</p>
        <form id="pay" hidden>
            <!-- Protect.js puts its card fields (an iframe) in this container -->
            <div id="pt_hpf_form"></div>
            <label><input type="checkbox" id="save" /> Keep this card for later payments</label>
            <p><button type="submit" id="submit">Pay</button></p>
        </form>
        <p id="result" role="status"></p>
        <script>
            const paymentId = new URLSearchParams(location.search).get("paymentId")
            const endpoint = "/rest/s1/mantle/my/payments/" + encodeURIComponent(paymentId) + "/payTrace"
            // one id per attempt: a repeated submit of the same attempt is answered from its first response, and a new
            // card after a decline or an error is a new attempt
            const newOperationId = () => "page-" + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("")
            let operationId = newOperationId()
            let instance = null
            const show = text => (document.getElementById("result").textContent = text)
            const sessionToken = () => document.querySelector("meta[name=moquiSessionToken]")?.content || sessionStorage.getItem("moquiSessionToken") || ""
            const loadScript = src => new Promise((resolve, reject) => {
                const script = document.createElement("script")
                script.src = src
                script.onload = resolve
                script.onerror = reject
                document.head.appendChild(script)
            })

            async function start() {
                const response = await fetch(endpoint, {credentials: "same-origin", headers: {Accept: "application/json"}})
                if (!response.ok) return show("This payment is not available")
                const config = await response.json()
                if (!config.clientKey) return show("Card payments are not set up")
                document.getElementById("amount").textContent = "Amount: " + config.amountText
                // the provider's script, from its documented origin (sandbox or production, chosen by the server)
                await loadScript(config.protectJsUrl)
                document.getElementById("pay").hidden = false
                instance = await PTPayment.setup({authorization: {clientKey: config.clientKey}})
            }

            async function pay(event) {
                event.preventDefault()
                if (!instance) return
                let tokenized
                try {
                    // Protect.js validates the fields and answers a one-time hpf_token and enc_key (never the card number)
                    tokenized = await PTPayment.process()
                } catch (error) {
                    const reasons = error?.reason || []
                    return show(reasons.map(reason => reason.description).join(" ") || "Check the card details")
                }
                show("Sending")
                const response = await fetch(endpoint, {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json", Accept: "application/json", "X-CSRF-Token": sessionToken()},
                    body: JSON.stringify({
                        hpfToken: tokenized.message.hpf_token,
                        encKey: tokenized.message.enc_key,
                        savePaymentMethod: document.getElementById("save").checked,
                        operationId
                    })
                })
                if (!response.ok) return show("The payment could not be sent; reload the page and try again")
                // (a failed request keeps its operation id: a retry of it is answered from the first answer, if any)
                const result = await response.json()
                const words = {
                    approved: "Paid. Thank you.",
                    pending: "The payment is being reviewed; you will be told when it is done.",
                    declined: "The card was declined. Try another card.",
                    unknown: "We could not confirm the payment yet. Do not pay again; we will check with the bank.",
                    error: "The payment could not be taken. Try again later."
                }
                show(words[result.state] || words.error)
                if (result.state === "declined" || result.state === "error") {
                    // the token was used: a new card is a new attempt with new fields
                    operationId = newOperationId()
                    PTPayment.reset()
                }
                if (result.state === "approved" || result.state === "pending" || result.state === "unknown")
                    document.getElementById("pay").hidden = true
            }

            document.getElementById("pay").addEventListener("submit", pay)
            start().catch(() => show("This payment is not available"))
        </script>
    </body>
</html>
